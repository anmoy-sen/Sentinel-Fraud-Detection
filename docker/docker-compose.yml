version: "3.9"

services:
  sentinel-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sentinel-fraud-detection
    ports:
      - "8501:8501"
    volumes:
      # Mount data and models so they persist and don't need to be in the image
      - ../data:/app/data
      - ../models:/app/models
      - ../metrics:/app/metrics
      - ../logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
